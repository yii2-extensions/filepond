---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build

permissions:
  contents: read

jobs:
  phpunit:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@e9c55bac434f8541fcd15d64d67578d16114e5a5 # v2.0.7
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      composer-command: require yiisoft/yii2:22.0.x-dev
      concurrency-group: phpunit-${{ github.workflow }}-${{ github.ref }}
      extensions: fileinfo, gd, sodium
      ignore-platform-reqs-php-version: "[8.6]"
      php-version: "[8.3, 8.4, 8.5, 8.6]"

  phpunit-compatibility:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@e9c55bac434f8541fcd15d64d67578d16114e5a5 # v2.0.7
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      composer-command: require yiisoft/yii2:~2.0.55
      concurrency-group: |
        phpunit-compatibility-${{ github.workflow }}-${{ github.ref }}
      extensions: fileinfo, gd, sodium
      ignore-platform-reqs-php-version: "[8.6]"
      php-version: "[8.3, 8.4, 8.5, 8.6]"
