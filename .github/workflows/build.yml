---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build

permissions:
  contents: read

jobs:
  phpunit:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@a28eb7d4ab03abd53ccd7c79014b3b27d09932ff # v2.0.1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      concurrency-group: phpunit-${{ github.workflow }}-${{ github.ref }}
      extensions: fileinfo, gd
      php-version: '["8.3","8.4","8.5"]'

  phpunit-yii22:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@a28eb7d4ab03abd53ccd7c79014b3b27d09932ff # v2.0.1
    with:
      concurrency-group: phpunit-yii22-${{ github.workflow }}-${{ github.ref }}
      extensions: fileinfo, gd
      hook: composer require "yiisoft/yii2:^22.0@dev" --no-interaction --no-progress --ansi
      php-version: '["8.3","8.5"]'
