---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: assets

permissions:
  contents: read

jobs:
  assets:
    uses: yii2-framework/actions/.github/workflows/assets.yml@1a1132f393d2572abaf9cc1fe75c5c86fce8c211 # v2.0.8
    with:
      commands: |
        npm run test:js
        npm run test:mutation
        npm run build
      drift-paths: |
        src/asset/**/*.min.css
        src/asset/**/*.min.js
