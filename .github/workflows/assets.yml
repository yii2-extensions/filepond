---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: assets

permissions:
  contents: read

jobs:
  assets:
    uses: yii2-framework/actions/.github/workflows/assets.yml@e9c55bac434f8541fcd15d64d67578d16114e5a5 # v2.0.7
    with:
      commands: |
        npm run test:js
        npm run test:mutation
        npm run build
      drift-paths: |
        src/asset/**/*.min.css
        src/asset/**/*.min.js
