---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: assets

permissions:
  contents: read

jobs:
  assets:
    uses: yii2-framework/actions/.github/workflows/assets.yml@e3e99bd1c54fb350911bf446690e6146acf7660d # v2.0.6
    with:
      commands: |
        npm run test:js
        npm run test:mutation
        npm run build
      drift-paths: |
        src/asset/**/*.min.css
        src/asset/**/*.min.js
