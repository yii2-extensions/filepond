---
on:
  - pull_request
  - push

name: quality

permissions:
  contents: read

jobs:
  quality:
    uses: yii2-framework/actions/.github/workflows/quality.yml@e9c55bac434f8541fcd15d64d67578d16114e5a5 # v2.0.7
    permissions:
      contents: read
    with:
      codespell-ignore-words-list: ist,oder,valide
      editorconfig-checker-exclude: '^package-lock\.json$|\.min\.(css|js)$'
